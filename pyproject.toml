[project]
name = "arsenal"
version = "2.5.0"
description = "Arsenal methodology is for assessing the dynamics of the risk of dangerous behavior and the commission of repeated socially dangerous acts by patients with mental disorders."
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Arsenal", email = "shadrov@pbstin.ru" }
]
requires-python = ">=3.10"
dependencies = [
    "textual>=8.2.8",
    "rich>=15.0.0",
    "openpyxl>=3.1.5",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "plotext>=5.2.8,<6.0.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
]

[tool.briefcase]
project_name = "arsenal"
bundle = "com.arsenal"
version = "2.5.0"
url = "https://github.com/vshadrov/arsenal"

[tool.briefcase.app.arsenal]
formal_name = "Arsenal"
description = "Arsenal"
long_description = "Arsenal methodology is for assessing the dynamics of the risk of dangerous behavior."
sources = [
    "src/arsenal",
]
test_sources = [
    "tests",
]

main_module = "arsenal.app"
main_function = "main"

console_app = true
icon = "resources/images/arsenal"

requires = [
    "textual>=8.2.8",
    "rich>=15.0.0",
    "openpyxl>=3.1.5",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "plotext>=5.2.8,<6.0.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
]

test_requires = [
    "pytest>=9.1.1",
]

[tool.briefcase.app.arsenal.macOS]
universal_build = true

[tool.briefcase.app.arsenal.linux]
categories = ["Office"]
terminal = true

[tool.briefcase.app.arsenal.linux.appimage]

[tool.briefcase.app.arsenal.linux.flatpak]
flatpak_runtime = "org.freedesktop.Platform"
flatpak_runtime_version = "24.08"
flatpak_sdk = "org.freedesktop.Sdk"
categories = ["Office"]

[tool.briefcase.app.arsenal.windows]
console = true