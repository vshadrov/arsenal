name: Build Arsenal
on: [push]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
      
      - name: Install System Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          # Добавлены flatpak и flatpak-builder для сборки Flatpak
          sudo apt install -y python3-dev python3-pip build-essential libffi-dev git flatpak flatpak-builder
          # Подключаем официальный репозиторий Flathub
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org
      
      - name: Install Briefcase
        run: |
          python3 -m pip install briefcase --break-system-packages

      - name: Build App
        run: |
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            # Собираем Linux форматы
            python3 -m briefcase package linux appimage --no-input --no-docker
            python3 -m briefcase package linux system --no-input
            # Добавлена сборка Flatpak
            python3 -m briefcase package linux flatpak --no-input
          elif [ "${{ matrix.os }}" = "windows-latest" ]; then
            briefcase package windows app --no-input
          else
            python3 -m briefcase package macOS app --no-input --adhoc-sign
          fi
        shell: bash

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arsenal-dist-${{ matrix.os }}
          path: dist/*
