name: Build Arsenal
on: [push]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # Возвращаем 3.12, так как библиотеки требуют свежий синтаксис

      - name: Install System Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y python3-dev python3-pip build-essential libffi-dev git \
                             gfortran libopenblas-dev pkg-config rpm

      - name: Install Briefcase
        run: |
          python -m pip install --upgrade pip
          python -m pip install briefcase
          
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            sudo python3 -m pip install briefcase --break-system-packages --ignore-installed
          fi

      - name: Build App (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # 1. Собираем AppImage ВНУТРИ контейнера manylinux2_24 (Флаг --no-docker убран!)
          python -m briefcase update linux appimage --no-input
          python -m briefcase package linux appimage --no-input
          
          # 2. Собираем Системные пакеты (.deb и .rpm) локально для текущей ubuntu-latest
          /usr/bin/python3 -m briefcase create linux system --no-input
          /usr/bin/python3 -m briefcase build linux system --no-input
          /usr/bin/python3 -m briefcase package linux system --no-input
        shell: bash

      - name: Build App (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          rm -rf build/
          python -m briefcase create macOS app --no-input
          python -m briefcase build macOS app --no-input
          python -m briefcase package macOS app --no-input --adhoc-sign

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arsenal-dist-${{ matrix.os }}
          path: |
            dist/*.AppImage
            dist/*.dmg
            dist/*.deb
            dist/*.rpm
          if-no-files-found: warn
